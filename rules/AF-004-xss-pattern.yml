id: AF-004
title: Cross-site scripting (XSS) pattern in request
description: >
  Request contains a common XSS pattern (script tags, event-handler attributes,
  javascript: URLs, dangerous tags). Heuristic: it flags a suspicious request, it does
  not confirm that the payload was executed.
severity: medium
type: match
mitre:
  tactic: Initial Access
  technique: T1190
  name: Exploit Public-Facing Application
conditions:
  - field: target
    operator: regex
    values:
      - '<\s*script\b'
      - '\bjavascript\s*:'
      - '<\s*\w+[^>]*\bon[a-z]+\s*='
      - '<\s*(iframe|svg|object|embed)\b'
      - '\bdocument\s*\.\s*(cookie|domain|write)\b'