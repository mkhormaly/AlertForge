id: AF-003
title: SQL injection pattern in request
description: >
  Request contains a common SQL injection pattern (UNION SELECT, tautologies, comment
  terminators, time-based functions). Heuristic: it flags a suspicious request, it does
  not confirm that the attack succeeded.
severity: high
type: match
mitre:
  tactic: Initial Access
  technique: T1190
  name: Exploit Public-Facing Application
conditions:
  - field: target
    operator: regex
    values:
      - '\bunion\b[\s/*+]+(all[\s/*+]+)?select\b'
      - '\b(or|and)\s+(\x27?\d+\x27?\s*=\s*\x27?\d+|\x27[^\x27]*\x27\s*=\s*\x27[^\x27]*)'
      - '\x27\s*(--|#|/\*)'
      - '\b(sleep|benchmark|pg_sleep)\s*\('
      - '\bwaitfor\s+delay\b'
      - '\binformation_schema\b'
      - ';\s*(drop|delete|insert|update|exec)\b'